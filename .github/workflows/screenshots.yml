name: Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    name: Render the screens with sample data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render
        run: ./gradlew testDebugUnitTest -Pscreenshots --stacktrace

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots
          if-no-files-found: warn
