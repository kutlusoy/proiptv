plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
}

def versionText = file('version.txt').text.trim()
def versionMatch = java.util.regex.Pattern.compile('^(\\d+)\\.(\\d+)\\.(\\d+)(-[0-9A-Za-z.]+)?$').matcher(versionText)
if (!versionMatch.matches()) {
    throw new GradleException("app/version.txt must look like 1.2.3 or 1.2.3-rc1, found: ${versionText}")
}
// Same scheme as tools/version.py, the release workflow checks that both agree
def computedVersionCode = versionMatch.group(1).toInteger() * 1_000_000 +
        versionMatch.group(2).toInteger() * 1_000 + versionMatch.group(3).toInteger()

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

android {
    namespace = 'com.kutlusoy.proiptv'
    compileSdk rootProject.ext.compileSdkVersion

    lint {
        disable 'UnsafeOptInUsageError', 'MissingTranslation'
    }

    defaultConfig {
        applicationId "com.kutlusoy.proiptv"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName versionText
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'proiptv-debug'
            keyPassword 'android'
        }
        release {
            def propsFile = file('signing/release.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile file("signing/${props['storeFile']}")
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file('signing/release.properties').exists()) {
                signingConfig = signingConfigs.release
            }
            debuggable = false
        }

        debug {
            signingConfig = signingConfigs.debug
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
            debuggable = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all { testTask ->
                if (project.hasProperty('screenshots')) {
                    testTask.include '**/Screenshot*'
                    testTask.systemProperty 'robolectric.pixelCopyRenderMode', 'hardware'
                } else {
                    testTask.exclude '**/Screenshot*'
                }
            }
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.09.01')
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'

    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    implementation 'androidx.room:room-paging:2.7.2'
    ksp 'androidx.room:room-compiler:2.7.2'
    implementation 'androidx.paging:paging-compose:3.3.6'
    implementation 'androidx.work:work-runtime-ktx:2.10.3'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'

    implementation 'io.coil-kt.coil3:coil-compose:3.3.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation platform('androidx.compose:compose-bom:2025.09.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.59.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.59.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}
